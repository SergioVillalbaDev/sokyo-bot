name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bot:
    name: Bot (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  panel:
    name: Panel (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sokyo-panelFRONTEND
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
