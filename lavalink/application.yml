# --- Configuración del servidor Lavalink (motor de música de Sokyo) ---
# Lavalink es un programa Java aparte que procesa el audio. El bot le manda
# órdenes y Lavalink reproduce en Discord. Arráncalo con:  npm run lavalink
# (ese lanzador descarga solo Lavalink 4.2.2 si el que hay es anterior a 4.2:
# Discord exige audio cifrado desde marzo de 2026 y sin él no se oye nada).
#
# La contraseña y las claves de Spotify se leen del .env del bot (gracias al
# lanzador scripts/lavalink.js). No hace falta tocar nada aquí en condiciones
# normales.

server:
  port: ${LAVALINK_PORT:2333}
  address: 127.0.0.1            # Solo accesible desde este PC (seguro)

plugins:
  # Plugin de YouTube (la fuente de audio real). Sustituye al YouTube interno
  # de Lavalink, que está obsoleto.
  youtube:
    enabled: true
    # Se prueban en este orden (si YouTube bloquea uno, se pasa al siguiente en
    # vez de quedarse en silencio). MUSIC solo busca; TV solo sirve con una cuenta
    # de YouTube conectada (panel → Música → «Cuenta de YouTube»). El lanzador
    # (scripts/lavalink.js) pone TV el primero cuando hay cuenta; YOUTUBE_CLIENTS
    # en el .env elige otra lista (separada por comas).
    clients: "${YOUTUBE_CLIENTS:MUSIC,ANDROID_VR,WEB,WEBEMBEDDED,MWEB,IOS,TVHTML5_SIMPLY,TV}"
    # Desde 2026 el plugin ya no sabe descifrar él solo las direcciones del audio
    # de YouTube: se lo pide a un servidor de cifrado (yt-cipher). Por defecto, el
    # público de su autor; YOUTUBE_CIPHER_URL en el .env usa otro (p. ej. uno propio).
    remoteCipher:
      url: "${YOUTUBE_CIPHER_URL:https://cipher.kikkia.dev/}"
      userAgent: "sokyo-bot"
    # La cuenta de YouTube NO va aquí: si el token caduca, Lavalink no arrancaría.
    # La pone el bot al conectarse (utils/cuentaYoutube.js).
  # LavaSrc: permite pegar URLs de Spotify. Lee solo los TÍTULOS de Spotify y
  # reproduce el audio desde YouTube (modo "mirror", igual que Jockie).
  # Funciona en cuanto pongas SPOTIFY_CLIENT_ID y SPOTIFY_CLIENT_SECRET en el .env.
  lavasrc:
    providers:
      - 'ytsearch:"%ISRC%"'   # busca por código ISRC (coincidencia exacta)
      - 'ytsearch:%QUERY%'    # si no, por nombre + artista
    sources:
      spotify: true
      deezer: false
      applemusic: false
      yandexmusic: false
    spotify:
      countryCode: 'ES'
      # SIN clientId/secret a propósito: así LavaSrc usa SOLO el token anónimo del
      # servidor local (carpeta spotify-tokener, arranca con "npm run lavalink"),
      # que sí puede cargar álbumes, playlists y búsquedas (la API oficial con la
      # app en modo desarrollo da 403). El servidor de tokens debe estar encendido.
      preferPartnerApi: true
      customTokenEndpoint: 'http://127.0.0.1:37353/api/getToken'

lavalink:
  plugins:
    # YouTube: la 1.18.2 (última publicada) dejó de sonar en agosto de 2026
    # («All clients failed… This video requires login»). Esta es la versión de
    # desarrollo con los arreglos (commit 2be8e54 de lavalink-devs/youtube-source,
    # 17-09-2026). Cuando salga la 1.18.3 o posterior, vuelve a la versión normal.
    # Lavalink borra solo el .jar de la versión anterior de lavalink/plugins.
    - dependency: "dev.lavalink.youtube:youtube-plugin:2be8e542d3f6f178e048dca565892684c2e40177"
      repository: "https://maven.lavalink.dev/snapshots"
      snapshot: true
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "${LAVALINK_PASSWORD:sokyolavalink}"
    sources:
      youtube: false           # lo aporta el plugin de arriba
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true               # streams de radio y URLs directas
      local: true              # archivos de música propios
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

logging:
  level:
    root: INFO
    lavalink: INFO
