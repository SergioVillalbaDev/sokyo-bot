<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sokyo · Tienda</title>
<meta name="robots" content="noindex" />
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #05040d; color: #e9ebf7; font-family: system-ui, sans-serif; }
  a { color: #c4b5fd; }
</style>
<script>
  // La tienda ahora vive dentro de "Mi cuenta" (/cuenta#tienda). Esta dirección
  // antigua sigue funcionando: lleva allí y conserva la sesión que ya hubiera.
  (function () {
    try {
      var vieja = localStorage.getItem('sokyo_token');
      if (vieja && !localStorage.getItem('portalToken')) localStorage.setItem('portalToken', vieja);
    } catch (e) { /* sin almacenamiento: tocará entrar de nuevo */ }
    location.replace('/cuenta#tienda');
  })();
</script>
</head>
<body>
  <p>Llevándote a la tienda… <a href="/cuenta#tienda">Pulsa aquí si no pasa nada</a>.</p>
</body>
</html>
